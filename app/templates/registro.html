{% extends "base.html" %}

{% block titulo %}Registrarse{% endblock %}

{% block contenido %}
  <h1>Crear cuenta</h1>
  <p class="sub">Así guardamos tus cálculos en tu historial.</p>

  {% include "_errores.html" %}

  <form method="post" novalidate>
    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" autocomplete="username" placeholder="Entre 3 y 20 caracteres"
           value="{{ request.form.usuario }}" required>

    <label for="clave">Contraseña</label>
    <input id="clave" name="clave" type="password" autocomplete="new-password"
           placeholder="Mínimo 6 caracteres" required>

    <label for="confirmacion">Repite la contraseña</label>
    <input id="confirmacion" name="confirmacion" type="password" autocomplete="new-password" required>

    <button type="submit">Registrarme</button>
  </form>

  <p class="nota">¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a></p>
{% endblock %}
