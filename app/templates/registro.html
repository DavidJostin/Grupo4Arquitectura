{% extends "base.html" %}

{% block titulo %}Registrarse{% endblock %}

{% block contenido %}
  <h1>Crear cuenta</h1>
  <p class="sub">Así guardamos tus cálculos en tu historial.</p>

  <form method="post" novalidate>
    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" value="{{ request.form.usuario }}" required>

    <label for="clave">Contraseña (mínimo 6 caracteres)</label>
    <input id="clave" name="clave" type="password" required>

    <label for="confirmacion">Repite la contraseña</label>
    <input id="confirmacion" name="confirmacion" type="password" required>

    <button type="submit">Registrarme</button>
  </form>

  {% include "_errores.html" %}

  <p class="nota">¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a></p>
{% endblock %}
